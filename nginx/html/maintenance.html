<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Back shortly</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #f8f9fa;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 480px;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1.5rem;
      opacity: 0.7;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    p {
      color: #666;
      line-height: 1.6;
      font-size: 1rem;
    }
    .retry {
      margin-top: 2rem;
      display: inline-block;
      padding: 0.625rem 1.5rem;
      background: #333;
      color: #fff;
      border-radius: 0.5rem;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
    }
    .retry:hover { background: #555; }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a; color: #e0e0e0; }
      p { color: #999; }
      .retry { background: #e0e0e0; color: #1a1a1a; }
      .retry:hover { background: #ccc; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">&#9881;</div>
    <h1>We'll be right back</h1>
    <p>We're doing a quick update. This usually takes less than a minute.</p>
    <a href="javascript:location.reload()" class="retry">Try again</a>
  </div>
</body>
</html>
