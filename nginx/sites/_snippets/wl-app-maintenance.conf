# Friendly maintenance page when the wl-website upstream is unreachable.
# Re-serves /maintenance.html as 503 Service Unavailable. We normalise from
# 502/504 to 503 because Cloudflare intercepts origin 502s and shows its own
# branded page, but passes 503 bodies through cleanly.
error_page 502 503 504 =503 /maintenance.html;

location = /maintenance.html {
    root /etc/nginx/html;
    internal;
    add_header Retry-After 60 always;
    add_header Cache-Control "no-store" always;
}
